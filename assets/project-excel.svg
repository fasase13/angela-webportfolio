  <line x1="25" y1="197" x2="485" y2="197" stroke="#331C2C" stroke-width="1" />
  <text x="40" y="185" fill="#887580" font-family="'JetBrains Mono', monospace" font-size="10">2</text>
  <text x="75" y="185" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Central Visayas</text>
  <text x="180" y="185" fill="#E2D4DC" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Cloud ERP</text>
  <text x="290" y="185" fill="#C2DC80" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">3,490,120</text>
  <text x="395" y="185" fill="#C2DC80" font-family="'JetBrains Mono', monospace" font-size="11">+8.7%</text>

  <!-- Row 3 -->
  <rect x="25" y="197" width="460" height="32" fill="#20131D" />
  <line x1="25" y1="229" x2="485" y2="229" stroke="#331C2C" stroke-width="1" />
  <text x="40" y="217" fill="#887580" font-family="'JetBrains Mono', monospace" font-size="10">3</text>
  <text x="75" y="217" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">NCR South</text>
  <text x="180" y="217" fill="#E2D4DC" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Data Warehousing</text>
  <text x="290" y="217" fill="#C2DC80" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">6,110,950</text>
  <text x="395" y="217" fill="#C2DC80" font-family="'JetBrains Mono', monospace" font-size="11">+22.1%</text>

  <!-- Row 4 -->
  <rect x="25" y="229" width="460" height="32" fill="#1C111A" />
  <line x1="25" y1="261" x2="485" y2="261" stroke="#331C2C" stroke-width="1" />
  <text x="40" y="249" fill="#887580" font-family="'JetBrains Mono', monospace" font-size="10">4</text>
  <text x="75" y="249" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Northern Luzon</text>
  <text x="180" y="249" fill="#E2D4DC" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">SaaS CRM</text>
