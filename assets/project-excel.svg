  <rect x="25" y="105" width="460" height="28" rx="10" fill="#291724" />
  <text x="40" y="123" fill="#EA9CAF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">#</text>
  <text x="75" y="123" fill="#EA9CAF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">REGION</text>
  <text x="180" y="123" fill="#EA9CAF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">CATEGORY</text>
  <text x="290" y="123" fill="#EA9CAF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">ACTUAL ($)</text>
  <text x="395" y="123" fill="#EA9CAF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">VARIANCE</text>

