  <text x="75" y="284" fill="#EA9CAF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800">TOTAL CONSOLIDATED</text>
  <text x="290" y="284" fill="#C2DC80" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">₱16,701,770</text>
  <text x="395" y="284" fill="#C2DC80" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">+11.9%</text>

  <!-- Slicer / Filter Badges -->
  <text x="40" y="325" fill="#EA9CAF" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">DYNAMIC SLICERS APPLIED:</text>
  <rect x="40" y="340" width="95" height="24" rx="12" fill="#D56989" />
  <text x="52" y="356" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">Year: 2025-26 ✕</text>

  <rect x="145" y="340" width="115" height="24" rx="12" fill="#362030" stroke="#C2DC80" stroke-width="1" />
  <text x="156" y="356" fill="#C2DC80" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">Status: Audited ✓</text>

  <rect x="270" y="340" width="110" height="24" rx="12" fill="#362030" stroke="#EA9CAF" stroke-width="1" />
  <text x="281" y="356" fill="#EA9CAF" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">Currency: PHP ₱</text>

