  <rect x="25" y="133" width="460" height="32" fill="#20131D" />
  <line x1="25" y1="165" x2="485" y2="165" stroke="#331C2C" stroke-width="1" />
  <text x="40" y="153" fill="#887580" font-family="'JetBrains Mono', monospace" font-size="10">1</text>
  <text x="75" y="153" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Western Visayas</text>
  <text x="180" y="153" fill="#E2D4DC" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Enterprise IS</text>
  <text x="290" y="153" fill="#C2DC80" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">4,820,400</text>
  <text x="395" y="153" fill="#C2DC80" font-family="'JetBrains Mono', monospace" font-size="11">+14.2%</text>

