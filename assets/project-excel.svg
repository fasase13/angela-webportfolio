<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="xlsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181117" />
      <stop offset="100%" stop-color="#261622" />
    </linearGradient>
    <linearGradient id="excelGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C2DC80" />
      <stop offset="100%" stop-color="#8DB046" />
    </linearGradient>
    <linearGradient id="petalAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D56989" />
      <stop offset="100%" stop-color="#EA9CAF" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#xlsBg)" />

  <!-- Excel Ribbon Mockup -->
  <rect x="0" y="0" width="800" height="55" rx="16" fill="#1F121C" />
  <rect x="25" y="15" width="24" height="24" rx="4" fill="#107C41" />
  <text x="31" y="32" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800">X</text>
  <text x="60" y="34" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Financial Modeling &amp; Advanced Pivot Analytics Workbook</text>
  <rect x="640" y="14" width="135" height="26" rx="13" fill="url(#excelGreen)" />
  <text x="660" y="31" fill="#1A240A" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800">MICROSOFT / CERTIFIED</text>

  <!-- Formula Bar -->
  <rect x="25" y="65" width="750" height="30" rx="6" fill="#291825" stroke="#EA9CAF" stroke-width="1" stroke-opacity="0.2" />
  <text x="40" y="85" fill="#C2DC80" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">fx</text>
  <line x1="65" y1="70" x2="65" y2="90" stroke="#3F2739" stroke-width="1" />
  <text x="75" y="85" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11">=XLOOKUP(A14, Dim_Products[SKU], Dim_Products[Gross_Margin]) * VLOOKUP(B14, Rates, 2, FALSE)</text>

  <!-- Left: Interactive Spreadsheet Grid -->
  <rect x="25" y="105" width="460" height="370" rx="10" fill="#1C111A" stroke="#D56989" stroke-width="1" stroke-opacity="0.2" />
  
