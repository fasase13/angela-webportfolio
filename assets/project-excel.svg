  <circle cx="637" cy="210" r="55" fill="none" stroke="#2B1A27" stroke-width="16" />
  <circle cx="637" cy="210" r="55" fill="none" stroke="#D56989" stroke-width="16" stroke-dasharray="140 300" stroke-linecap="round" />
  <circle cx="637" cy="210" r="55" fill="none" stroke="#C2DC80" stroke-width="16" stroke-dasharray="90 300" stroke-dashoffset="-145" stroke-linecap="round" />
  <circle cx="637" cy="210" r="55" fill="none" stroke="#EA9CAF" stroke-width="16" stroke-dasharray="60 300" stroke-dashoffset="-240" stroke-linecap="round" />
  <text x="618" y="215" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800">92%</text>
  <text x="612" y="228" fill="#C2DC80" font-family="'Plus Jakarta Sans', sans-serif" font-size="8">Model Match</text>

  <!-- Legend -->
  <g font-family="'Plus Jakarta Sans', sans-serif" font-size="10">
    <rect x="520" y="290" width="10" height="10" rx="2" fill="#D56989" />
    <text x="536" y="300" fill="#E2D4DC">Enterprise Systems (45%)</text>

    <rect x="520" y="310" width="10" height="10" rx="2" fill="#C2DC80" />
    <text x="536" y="320" fill="#E2D4DC">Cloud ERP (32%)</text>

    <rect x="520" y="330" width="10" height="10" rx="2" fill="#EA9CAF" />
    <text x="536" y="340" fill="#E2D4DC">Data Warehouses (23%)</text>
  </g>

  <!-- Competency Stamp -->
  <rect x="520" y="370" width="235" height="85" rx="8" fill="#170E15" stroke="#C2DC80" stroke-width="1" stroke-opacity="0.4" />
  <text x="535" y="393" fill="#C2DC80" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">CERTIFIED COMPETENCIES:</text>
  <text x="535" y="412" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">✓ Multi-Table Pivot Analysis</text>
  <text x="535" y="428" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">✓ Statistical Variance &amp; Trend Models</text>
  <text x="535" y="444" fill="#EA9CAF" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">✓ Executive Visual Storytelling</text>
</svg>
